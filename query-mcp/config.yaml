databases:
  - name: ap_dashboard
    env_var: AP_DASHBOARD_DB_URL
    description: >
      AP (Accounts Payable) invoice data from SAGE exports. Contains invoices,
      hold lists, vendor payment history, and PDF receipt check results.
      Key tables: invoices, holds, uploads, invoice_notes, attachments.

  - name: pcard
    env_var: PCARD_DB_URL
    description: >
      Purchase card (P-card) transaction data populated from spreadsheet uploads.
      Tracks employee spending, flags policy violations such as prohibited vendor
      categories (e.g. Uber Black), and stores suspicious transaction records.
      IMPORTANT — snapshot design, do NOT query raw tables unfiltered: every
      upload is preserved as a full immutable batch (load_batches), so
      transactions, flight_segments, uber_trips, meal_attendees and
      outstanding_snapshots each contain one complete copy of the data per
      batch_id. Unfiltered aggregates are inflated ~5-6x. Always resolve the
      current batches first: SELECT transactions_batch_id, flights_batch_id,
      uber_batch_id, meals_batch_id, roster_version_id FROM dataset_versions
      WHERE is_active — then filter each table by that batch_id (roster_employees
      by version_id). The violations table is precomputed per dataset version;
      filter it by the active dataset_versions.id (dataset_version_id) — never
      sum violations across versions. Note: within a single batch a
      reference_no can legitimately span multiple rows (multi-line entries).
      Gotcha: transactions.employee_id is zero-padded (e.g. '006011') but
      roster_employees.employee_id is not ('6011') — join with
      ltrim(transactions.employee_id, '0') = roster_employees.employee_id.

  - name: aging_report
    env_var: AGING_REPORT_DB_URL
    description: >
      AP "Days Aging" snapshots from Concur exports. Every weekly xlsx upload
      is preserved as a separate snapshot (uploads table); invoices are not
      upserted — each upload has its own full set of rows. Key tables:
      invoices (req_id, employee, supplier, total, days_aging, status,
      bucket), uploads (snapshot_date, label), exclusions (rows skipped at
      parse time), alert_actions (per-employee follow-up state, keyed by
      email), notifications_sent (Email/Teams audit log), roster
      (employee→company/dept/cost-center, bulk-replaced), roster_meta
      (last roster upload metadata), vendor_notes, invoice_issues.
      When querying invoices, you almost always want to
      filter by upload_id (the snapshot) — typically the most recent.
      Ignore uploads.file_bytes (raw xlsx).
